name: Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Must be >= the `go` directive in go.mod, which krateo-platformops/plumbing
          # (crdgen) raises to 1.25.6. With GOTOOLCHAIN=auto a lower pin still builds, by
          # silently downloading a newer toolchain mid-job — so the release binary would be
          # produced by a Go version this file does not name. Pin it explicitly instead.
          go-version: '1.25.6'

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
